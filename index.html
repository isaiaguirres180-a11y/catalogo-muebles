<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mueblería Z&G - Catálogo Oficial</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .modal-active { overflow: hidden; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- ENCABEZADO Y BRANDING -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2">
        <i data-lucide="armchair" class="w-8 h-8 text-amber-400"></i>
        <h1 class="text-2xl font-bold tracking-tight">Mueblería <span class="text-amber-400">Z&G</span></h1>
      </div>
      <p class="text-xs md:text-sm text-gray-300 text-center">Diseño y Fabricación de Muebles a Medida</p>
      
      <div class="flex items-center gap-3">
        <!-- Indicador de Modo Admin -->
        <button id="adminToggleBtn" onclick="toggleAdminMode()" class="flex items-center gap-1 text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-lg border border-amber-400/30 transition">
          <i data-lucide="lock" class="w-3.5 h-3.5"></i>
          <span id="adminBtnText">Acceso Admin</span>
        </button>
      </div>
    </div>
  </header>

  <!-- PANEL DE ADMINISTRADOR (Invariablemente oculto por defecto) -->
  <div id="adminPanel" class="hidden bg-amber-50 border-b border-amber-200 p-4 transition-all">
    <div class="max-w-7xl mx-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-amber-900 flex items-center gap-2">
          <i data-lucide="settings" class="w-5 h-5 text-amber-600"></i> Panel de Administración del Catálogo
        </h2>
        <div class="flex gap-2">
          <button onclick="exportData()" class="text-xs bg-white border border-amber-300 text-amber-800 px-3 py-1 rounded hover:bg-amber-100 flex items-center gap-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar Respaldos
          </button>
          <button onclick="logoutAdmin()" class="text-xs bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200">
            Cerrar Sesión
          </button>
        </div>
      </div>

      <!-- FORMULARIO AGREGAR / EDITAR MUEBLE -->
      <form id="productForm" onsubmit="handleFormSubmit(event)" class="bg-white p-4 rounded-xl shadow-sm border border-amber-200 grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="hidden" id="prodId">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Mueble</label>
          <input type="text" id="prodTitle" required placeholder="Ej: Vanity Moderno con Luces" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-amber-400 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Categoría / Espacio</label>
          <select id="prodCategory" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-amber-400 outline-none">
            <option value="vanities">Vanities / Peinadores</option>
            <option value="closets">Roperos / Closets</option>
            <option value="camas">Camas y Respaldos</option>
            <option value="salas">Salas / Mesas</option>
            <option value="otros">Otros Muebles</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Precio (C$)</label>
          <input type="number" id="prodPrice" required placeholder="Ej: 4500" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-amber-400 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ancho (cm)</label>
          <input type="number" id="prodWidth" required placeholder="Ej: 90" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-amber-400 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Alto (cm)</label>
          <input type="number" id="prodHeight" required placeholder="Ej: 160" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-amber-400 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Profundidad (cm)</label>
          <input type="number" id="prodDepth" required placeholder="Ej: 40" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-amber-400 outline-none">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Imagen del Mueble (Cargar archivo o pegar URL)</label>
          <div class="flex gap-2">
            <input type="text" id="prodImage" placeholder="https://ejemplo.com/imagen.jpg" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-amber-400 outline-none">
            <input type="file" id="prodFile" accept="image/*" onchange="handleFileUpload(event)" class="hidden">
            <button type="button" onclick="document.getElementById('prodFile').click()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded text-xs whitespace-nowrap flex items-center gap-1 border">
              <i data-lucide="upload" class="w-4 h-4"></i> Subir Foto
            </button>
          </div>
        </div>

        <div class="md:col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Descripción</label>
          <textarea id="prodDesc" rows="1" placeholder="Materiales, acabados, detalles..." class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-amber-400 outline-none"></textarea>
        </div>

        <div class="md:col-span-3 flex justify-end gap-2">
          <button type="button" onclick="resetForm()" class="px-4 py-2 text-xs bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Limpiar Formulario</button>
          <button type="submit" id="formSubmitBtn" class="px-6 py-2 text-xs bg-amber-600 text-white font-bold rounded hover:bg-amber-700 shadow">Guardar Mueble</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow grid grid-cols-1 md:grid-cols-4 gap-6">
    
    <!-- BARRA LATERAL - FILTROS POR ESPACIO -->
    <aside class="md:col-span-1 bg-white p-5 rounded-xl shadow-sm border border-gray-100 h-fit">
      <h2 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
        <i data-lucide="ruler" class="w-5 h-5 text-amber-500"></i> Filtrar por Espacio
      </h2>
      
      <!-- Buscador -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Buscar Mueble</label>
        <input type="text" id="searchQuery" oninput="renderProducts()" placeholder="Ej: Vanity, Closet..." class="w-full text-sm border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none">
      </div>

      <!-- Filtro por Categoria -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Categoría</label>
        <select id="categoryFilter" onchange="renderProducts()" class="w-full text-sm border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none">
          <option value="all">Todas las categorías</option>
          <option value="vanities">Vanities / Peinadores</option>
          <option value="closets">Roperos / Closets</option>
          <option value="camas">Camas y Respaldos</option>
          <option value="salas">Salas / Mesas</option>
          <option value="otros">Otros Muebles</option>
        </select>
      </div>

      <!-- Filtro por Dimensiones -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ancho máximo disponible (cm)</label>
          <input type="number" id="maxWidth" oninput="renderProducts()" placeholder="Sin límite" class="w-full text-sm border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Alto máximo disponible (cm)</label>
          <input type="number" id="maxHeight" oninput="renderProducts()" placeholder="Sin límite" class="w-full text-sm border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none">
        </div>
      </div>

      <button onclick="resetFilters()" class="w-full mt-4 text-xs text-slate-500 hover:text-amber-600 border border-gray-200 py-2 rounded-lg transition">
        Restablecer Filtros
      </button>
    </aside>

    <!-- GRILLA DE PRODUCTOS -->
    <section class="md:col-span-3">
      <div class="flex justify-between items-center mb-4">
        <p id="productCount" class="text-sm text-gray-500 font-medium">Cargando muebles...</p>
      </div>

      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Las tarjetas se generan dinámicamente -->
      </div>
    </section>
  </main>

  <!-- FOOTER CON ASIGNACIÓN DE VENDEDOR -->
  <footer class="bg-slate-900 text-gray-400 py-6 text-center text-xs mt-8">
    <p>© 2026 Mueblería Z&G - Todos los derechos reservados.</p>
    <p class="mt-1 text-slate-500">Atención personalizada y ventas directas</p>
  </footer>

  <!-- MODAL DE DETALLES -->
  <div id="detailModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl relative animate-fade-in">
      <button onclick="closeModal()" class="absolute top-3 right-3 bg-white/80 hover:bg-white rounded-full p-1 text-gray-700 shadow z-10">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <img id="modalImage" src="" alt="Mueble" class="w-full h-64 object-cover">
      <div class="p-6">
        <h3 id="modalTitle" class="text-xl font-bold text-gray-900 mb-2"></h3>
        <p id="modalPrice" class="text-2xl font-black text-amber-600 mb-4"></p>
        
        <div class="bg-gray-50 p-3 rounded-lg mb-4 grid grid-cols-3 text-center border border-gray-100">
          <div>
            <span class="block text-xs text-gray-400">Ancho</span>
            <span id="modalWidth" class="font-bold text-gray-700"></span> cm
          </div>
          <div>
            <span class="block text-xs text-gray-400">Alto</span>
            <span id="modalHeight" class="font-bold text-gray-700"></span> cm
          </div>
          <div>
            <span class="block text-xs text-gray-400">Profundidad</span>
            <span id="modalDepth" class="font-bold text-gray-700"></span> cm
          </div>
        </div>

        <p id="modalDesc" class="text-sm text-gray-600 mb-6 leading-relaxed"></p>

        <a id="modalWpBtn" href="#" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-green-600/20">
          <i data-lucide="message-circle" class="w-5 h-5"></i> Pedir por WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- SCRIPT DE LÓGICA GENERAL -->
  <script>
    // DATOS INICIALES POR DEFECTO
    const initialProducts = [
      {
        id: "vanity-01",
        title: "Vanity Flotante Moderno",
        category: "vanities",
        price: 4800,
        width: 80,
        height: 150,
        depth: 35,
        description: "Vanity flotante con espejo rectangular e iluminación focalizada. Excelente opción para ahorrar espacio en recámaras.",
        image: "https://images.unsplash.com/photo-1595428774223-ef52624120d2?auto=format&fit=crop&q=80&w=600"
      },
      {
        id: "closet-01",
        title: "Closet Modular Z&G",
        category: "closets",
        price: 9500,
        width: 150,
        height: 200,
        depth: 50,
        description: "Ropero de 3 divisiones con gaveteros integrados y espacio para colgar ropa larga.",
        image: "https://images.unsplash.com/photo-1558882224-dda166733046?auto=format&fit=crop&q=80&w=600"
      }
    ];

    let products = [];
    let isAdmin = false;
    const ADMIN_PIN = "1234"; // Puedes cambiar esta contraseña por la de tu preferencia

    // INICIALIZACIÓN
    window.addEventListener('DOMContentLoaded', () => {
      const savedProducts = localStorage.getItem('zg_products');
      if (savedProducts) {
        products = JSON.parse(savedProducts);
      } else {
        products = [...initialProducts];
        saveProductsToStorage();
      }
      renderProducts();
      lucide.createIcons();
    });

    function saveProductsToStorage() {
      localStorage.setItem('zg_products', JSON.stringify(products));
    }

    // MODAL Y MODO ADMINISTRADOR
    function toggleAdminMode() {
      if (isAdmin) {
        logoutAdmin();
      } else {
        const pin = prompt("Ingrese la clave de administrador:");
        if (pin === ADMIN_PIN) {
          isAdmin = true;
          document.getElementById('adminPanel').classList.remove('hidden');
          document.getElementById('adminBtnText').innerText = "Modo Admin Activo";
          document.getElementById('adminToggleBtn').classList.add('bg-amber-500', 'text-slate-900');
          renderProducts();
        } else if (pin !== null) {
          alert("Clave incorrecta.");
        }
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('adminBtnText').innerText = "Acceso Admin";
      document.getElementById('adminToggleBtn').classList.remove('bg-amber-500', 'text-slate-900');
      resetForm();
      renderProducts();
    }

    // MANEJO DE IMÁGENES CARGADAS
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('prodImage').value = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // AGREGAR / EDITAR MUEBLE
    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('prodId').value || 'mueble-' + Date.now();
      const newProduct = {
        id: id,
        title: document.getElementById('prodTitle').value,
        category: document.getElementById('prodCategory').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        width: parseFloat(document.getElementById('prodWidth').value),
        height: parseFloat(document.getElementById('prodHeight').value),
        depth: parseFloat(document.getElementById('prodDepth').value),
        image: document.getElementById('prodImage').value || 'https://via.placeholder.com/600x400?text=Sin+Imagen',
        description: document.getElementById('prodDesc').value
      };

      const existingIndex = products.findIndex(p => p.id === id);
      if (existingIndex >= 0) {
        products[existingIndex] = newProduct;
      } else {
        products.push(newProduct);
      }

      saveProductsToStorage();
      renderProducts();
      resetForm();
      alert("¡Mueble guardado con éxito!");
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id === id);
      if (p) {
        document.getElementById('prodId').value = p.id;
        document.getElementById('prodTitle').value = p.title;
        document.getElementById('prodCategory').value = p.category;
        document.getElementById('prodPrice').value = p.price;
        document.getElementById('prodWidth').value = p.width;
        document.getElementById('prodHeight').value = p.height;
        document.getElementById('prodDepth').value = p.depth;
        document.getElementById('prodImage').value = p.image;
        document.getElementById('prodDesc').value = p.description;
        document.getElementById('formSubmitBtn').innerText = "Actualizar Mueble";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function deleteProduct(id) {
      if (confirm("¿Seguro que deseas eliminar este mueble del catálogo?")) {
        products = products.filter(p => p.id !== id);
        saveProductsToStorage();
        renderProducts();
      }
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.getElementById('prodId').value = '';
      document.getElementById('formSubmitBtn').innerText = "Guardar Mueble";
    }

    // RENDERIZADO DE PRODUCTOS Y FILTROS
    function renderProducts() {
      const search = document.getElementById('searchQuery').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      const maxWidth = parseFloat(document.getElementById('maxWidth').value) || Infinity;
      const maxHeight = parseFloat(document.getElementById('maxHeight').value) || Infinity;

      const filtered = products.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
        const matchesCategory = category === 'all' || p.category === category;
        const matchesWidth = p.width <= maxWidth;
        const matchesHeight = p.height <= maxHeight;
        return matchesSearch && matchesCategory && matchesWidth && matchesHeight;
      });

      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      document.getElementById('productCount').innerText = `Mostrando ${filtered.length} de ${products.length} muebles`;

      filtered.forEach(p => {
        const wpMessage = encodeURIComponent(`Hola, me interesa solicitar el mueble "${p.title}" (Medidas: ${p.width}x${p.height}x${p.depth} cm). Código de vendedor: ISAIF`);
        const wpUrl = `https://wa.me/50588888888?text=${wpMessage}`;

        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition border border-gray-100 overflow-hidden flex flex-col relative group";
        
        card.innerHTML = `
          ${isAdmin ? `
            <div class="absolute top-2 right-2 z-20 flex gap-1 bg-white/90 p-1 rounded-lg shadow">
              <button onclick="editProduct('${p.id}')" class="p-1 text-amber-600 hover:bg-amber-50 rounded" title="Editar"><i data-lucide="pencil" class="w-4 h-4"></i></button>
              <button onclick="deleteProduct('${p.id}')" class="p-1 text-red-600 hover:bg-red-50 rounded" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          ` : ''}
          <img src="${p.image}" alt="${p.title}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-300">
          <div class="p-4 flex-grow flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-800 text-base mb-1">${p.title}</h3>
              <p class="text-amber-600 font-extrabold text-lg mb-2">C$ ${p.price.toLocaleString()}</p>
              <div class="text-xs text-gray-500 mb-3 bg-gray-50 p-2 rounded flex justify-around">
                <span><strong>An:</strong> ${p.width} cm</span>
                <span><strong>Al:</strong> ${p.height} cm</span>
                <span><strong>Prof:</strong> ${p.depth} cm</span>
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="openModal('${p.id}')" class="flex-1 text-xs border border-amber-500 text-amber-600 font-bold py-2 rounded-lg hover:bg-amber-50 transition">Ver Detalles</button>
              <a href="${wpUrl}" target="_blank" class="flex-1 text-xs bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg flex items-center justify-center gap-1 transition">
                <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> Pedir
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function resetFilters() {
      document.getElementById('searchQuery').value = '';
      document.getElementById('categoryFilter').value = 'all';
      document.getElementById('maxWidth').value = '';
      document.getElementById('maxHeight').value = '';
      renderProducts();
    }

    // DETALLES Y MODAL
    function openModal(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;

      document.getElementById('modalImage').src = p.image;
      document.getElementById('modalTitle').innerText = p.title;
      document.getElementById('modalPrice').innerText = `C$ ${p.price.toLocaleString()}`;
      document.getElementById('modalWidth').innerText = p.width;
      document.getElementById('modalHeight').innerText = p.height;
      document.getElementById('modalDepth').innerText = p.depth;
      document.getElementById('modalDesc').innerText = p.description;

      const wpMessage = encodeURIComponent(`Hola, me interesa el mueble "${p.title}" (Medidas: ${p.width}x${p.height}x${p.depth} cm). Código de vendedor: ISAIF`);
      document.getElementById('modalWpBtn').href = `https://wa.me/50588888888?text=${wpMessage}`;

      document.getElementById('detailModal').classList.remove('hidden');
      document.body.classList.add('modal-active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.body.classList.remove('modal-active');
    }

    // EXPORTAR DATO PARA BACKUP
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "catalogo_muebles_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
